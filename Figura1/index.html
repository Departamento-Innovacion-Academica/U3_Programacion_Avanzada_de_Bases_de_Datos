<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Arquitectura Espaciado y Animado</title>
    <style>
        body {
            background-color: #f4f5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 50px 20px;
            overflow-x: hidden; 
        }

        .diagram-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- Animación --- */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-element {
            animation: fadeInDown 0.6s ease-out forwards;
            opacity: 0; 
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.4s; }
        .delay-4 { animation-delay: 0.55s; }
        .delay-5 { animation-delay: 0.7s; }
        .delay-6 { animation-delay: 0.85s; }
        .delay-7 { animation-delay: 1.0s; }
        .delay-8 { animation-delay: 1.15s; }
        .delay-9 { animation-delay: 1.3s; }

        /* --- Nodos --- */
        .node {
            background-color: #15162c;
            color: #ffffff;
            border-radius: 16px;
            padding: 22px 25px;
            text-align: center;
            width: 200px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 2;
            box-sizing: border-box;
        }

        .node span {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.3;
            display: block;
        }

        .icon {
            font-size: 36px;
            line-height: 1;
        }

        /* --- Flechas Simples con más separación --- */
        .arrow-simple {
            width: 2px;
            height: 60px; /* Mayor altura de separación */
            background-color: #000000;
            position: relative;
        }
        .arrow-simple::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: -5px;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #000000;
        }

        /* --- Conector Superior Ampliado --- */
        .top-branch-container {
            position: relative;
            width: 630px;
            height: 70px; /* Mayor espacio vertical para respirar */
        }
        .top-branch-container::before {
            content: '';
            position: absolute; top: 0; left: 50%;
            width: 2px; height: 35px; /* Línea que baja desde Aplicaciones más larga */
            background-color: #000000; transform: translateX(-50%);
        }
        .top-horizontal-bar {
            position: absolute; top: 25px; left: 0; right: 0;
            height: 2px; background-color: #000000;
        }
        .top-drop {
            position: absolute; top: 25px;
            width: 2px; height: 35px; /* Patas que bajan hacia los cuadros más largas */
            background-color: #000000;
        }
        .top-drop::after {
            content: ''; position: absolute; bottom: -5px; left: -5px;
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #000000;
        }
        .drop-left { left: 0; }
        .drop-center { left: 50%; transform: translateX(-50%); }
        .drop-right { right: 0; }

        /* Fila Nivel 3 */
        .row-three {
            display: flex; gap: 30px; z-index: 2;
        }

        /* --- Conector Inferior Ampliado --- */
        .bottom-branch-container {
            position: relative;
            width: 630px;
            height: 70px; /* Mayor espacio vertical inferior */
        }
        .bottom-rise {
            position: absolute; bottom: 35px;
            width: 2px; height: 35px; /* Patas que suben desde los cuadros más largas */
            background-color: #000000;
        }
        .rise-left { left: 0; }
        .rise-center { left: 50%; transform: translateX(-50%); }
        .rise-right { right: 0; }
        .bottom-horizontal-bar {
            position: absolute; bottom: 35px; left: 0; right: 0;
            height: 2px; background-color: #000000;
        }
        .bottom-branch-container::after {
            content: ''; position: absolute; bottom: 0; left: 50%;
            width: 2px; height: 35px; /* Línea final hacia el sistema gestor más larga */
            background-color: #000000; transform: translateX(-50%);
        }
        .final-arrow-head {
            position: absolute; bottom: -5px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #000000;
            z-index: 3;
        }

        /* Modificadores */
        .wide-node { width: 220px !important; }
    </style>
</head>
<body>

    <div class="diagram-container">
        
        <!-- Nivel 1: Usuarios -->
        <div class="node animate-element delay-1">
            <div class="icon">👥</div>
            <span>Usuarios</span>
        </div>

        <!-- Flecha 1 -->
        <div class="arrow-simple animate-element delay-2"></div>
<br>
        <!-- Nivel 2: Aplicaciones -->
        <div class="node animate-element delay-3">
            <div class="icon">💻</div>
            <span>Aplicaciones</span>
        </div>

        <!-- Conector Superior -->
        <div class="top-branch-container animate-element delay-4">
            <div class="top-horizontal-bar"></div>
            <div class="top-drop drop-left"></div>
            <div class="top-drop drop-center"></div>
            <div class="top-drop drop-right"></div>
        </div>
<br>
        <!-- Nivel 3: Fila de los tres sistemas -->
        <div class="row-three animate-element delay-5">
            <div class="node">
                <div class="icon">🛒</div>
                <span>Sistema ventas</span>
            </div>
            <div class="node">
                <div class="icon">📦</div>
                <span>Sistema inventario</span>
            </div>
            <div class="node">
                <div class="icon">📊</div>
                <span>Sistema finanzas</span>
            </div>
        </div>

        <!-- Conector Inferior -->
        <div class="bottom-branch-container animate-element delay-6">
            <div class="bottom-rise rise-left"></div>
            <div class="bottom-rise rise-center"></div>
            <div class="bottom-rise rise-right"></div>
            <div class="bottom-horizontal-bar"></div>
            <div class="final-arrow-head"></div>
        </div>
<br>
        <!-- Nivel 4: Sistema gestor -->
        <div class="node wide-node animate-element delay-7">
            <div class="icon">🗄️</div>
            <span>Sistema gestor<br>de bases de datos</span>
        </div>

        <!-- Flecha 4 -->
        <div class="arrow-simple animate-element delay-8"></div>
<br>
        <!-- Nivel 5: Base de datos -->
        <div class="node animate-element delay-9">
            <div class="icon">🛢️</div>
            <span>Base de datos</span>
        </div>

    </div>

</body>
</html>
