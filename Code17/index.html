<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efecto Typing Python - Flask SQLite POST</title>
  <style>
    /* Estilos generales */
    body {
      background-color: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
    }

    /* Ventana tipo terminal */
    .code-window {
      background-color: #1e1e24;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Barra superior de la ventana */
    .window-header {
      background-color: #18181c;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .close { background-color: #ff5f56; }
    .minimize { background-color: #ffbd2e; }
    .maximize { background-color: #27c93f; }

    .window-title {
      color: #7a7a8c;
      font-size: 13px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Área donde se escribe el código */
    .code-body {
      padding: 28px 32px;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: left;
    }

    /* Colores del Syntax Highlighting estilo Flask/SQLite */
    .keyword { color: #ff5555; font-weight: bold; }   /* from, import, def, return, .json */
    .variable { color: #2e7cd6; }                      /* app, conexion */
    .decorator { color: #2e7cd6; }                     /* @app.route */
    .fn-name { color: #9a66ff; }                       /* agregar_empleado */
    .string { color: #2e7cd6; }                        /* '/empleados', 'POST', 'empresa.db', "INSERT...", etc. */

    /* Cursor parpadeante fino (estilo editor) */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background-color: #ffffff;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="code-window">
    <div class="window-header">
      <span class="btn-circle close"></span>
      <span class="btn-circle minimize"></span>
      <span class="btn-circle maximize"></span>
      <span class="window-title">flask_sqlite_post.py</span>
    </div>
    <div class="code-body"><span id="code-content"></span><span class="cursor"></span></div>
  </div>

  <script>
    // Configuración de tokens para flask_sqlite_post
    const tokens = [
      { text: "from", class: "keyword" },
      { text: " flask " },
      { text: "import", class: "keyword" },
      { text: " Flask, request, jsonify\n" },
      { text: "import", class: "keyword" },
      { text: " sqlite3\n\n" },
      { text: "app", class: "variable" },
      { text: " = Flask(__name__)\n\n" },
      { text: "@app", class: "decorator" },
      { text: ".route(" },
      { text: "'/empleados'", class: "string" },
      { text: ", methods=[" },
      { text: "'POST'", class: "string" },
      { text: "])\n" },
      { text: "def", class: "keyword" },
      { text: " " },
      { text: "agregar_empleado", class: "fn-name" },
      { text: "():\n    datos = request." },
      { text: "json", class: "keyword" },
      { text: "\n    " },
      { text: "conexion", class: "variable" },
      { text: " = sqlite3.connect(" },
      { text: "'empresa.db'", class: "string" },
      { text: ")\n    cursor = conexion.cursor()\n    cursor.execute(\n" },
      { text: '"INSERT INTO empleados(nombre, salario) VALUES (?, ?)"', class: "string" },
      { text: ",\n        (datos[" },
      { text: "'nombre'", class: "string" },
      { text: "], datos[" },
      { text: "'salario'", class: "string" },
      { text: "])\n    )\n    conexion.commit()\n    " },
      { text: "return", class: "keyword" },
      { text: " jsonify({" },
      { text: '"mensaje"', class: "string" },
      { text: ": " },
      { text: '"Empleado agregado"', class: "string" },
      { text: "})\n\napp.run()" }
    ];

    const container = document.getElementById("code-content");
    let tokenIndex = 0;
    let charIndex = 0;
    let currentElement = null;

    function typeCode() {
      if (tokenIndex < tokens.length) {
        const currentToken = tokens[tokenIndex];

        // Crear elemento para el nuevo token
        if (charIndex === 0) {
          if (currentToken.class) {
            currentElement = document.createElement("span");
            currentElement.className = currentToken.class;
            container.appendChild(currentElement);
          } else {
            currentElement = document.createTextNode("");
            container.appendChild(currentElement);
          }
        }

        // Agregar carácter actual
        const char = currentToken.text.charAt(charIndex);
        if (currentToken.class) {
          currentElement.textContent += char;
        } else {
          currentElement.nodeValue += char;
        }

        charIndex++;

        // Pasar al siguiente token cuando se complete
        if (charIndex === currentToken.text.length) {
          charIndex = 0;
          tokenIndex++;
        }

        // Velocidad de escritura (35ms)
        setTimeout(typeCode, 35);
      }
    }

    // Iniciar animación tras un breve retraso
    setTimeout(typeCode, 500);
  </script>

</body>
</html>
